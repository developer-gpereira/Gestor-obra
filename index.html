<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-[#f4f6fc]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Custos - Obra</title>
    <!-- Tailwind CSS para estilização moderna e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f4ff',
                            100: '#dbeafe',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            900: '#1e3a8a',
                            darkBg: '#0f172a',
                            darkCard: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js para Relatórios Visuais -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar para visual premium */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="h-full text-slate-800 dark:text-slate-200 transition-colors duration-200">

    <!-- CONTAINER DA SPA -->
    <div class="flex h-full overflow-hidden">
        
        <!-- SIDEBAR DE NAVEGAÇÃO -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 flex flex-col w-72 bg-[#111c43] text-white transition-transform duration-300 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-auto">
            <!-- Header da Marca -->
            <div class="flex items-center gap-3 px-6 py-5 border-b border-slate-700/50">
                <div class="flex items-center justify-center w-10 h-10 bg-brand-500 rounded-xl text-white shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-house-chimney text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Obra Minha Casa</h1>
                    <span class="text-xs text-slate-400 font-medium">Reforma</span>
                </div>
                <button onclick="UI.toggleSidebar()" class="lg:hidden ml-auto text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Links de Navegação da SPA -->
            <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
                <button onclick="Router.navigate('dashboard')" data-nav="dashboard" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-chart-pie w-5 text-center"></i> Dashboard
                </button>
                <button onclick="Router.navigate('materials')" data-nav="materials" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-boxes-stacked w-5 text-center"></i> Itens / Materiais
                </button>
                <button onclick="Router.navigate('purchases')" data-nav="purchases" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-cart-shopping w-5 text-center"></i> Compras
                </button>
                <button onclick="Router.navigate('expenses')" data-nav="expenses" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-dollar-sign w-5 text-center"></i> Despesas
                </button>
                <button onclick="Router.navigate('stages')" data-nav="stages" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-bars-progress w-5 text-center"></i> Etapas da Obra
                </button>
                <button onclick="Router.navigate('suppliers')" data-nav="suppliers" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-truck-field w-5 text-center"></i> Fornecedores
                </button>
                <button onclick="Router.navigate('reports')" data-nav="reports" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> Relatórios
                </button>
                <button onclick="Router.navigate('settings')" data-nav="settings" class="flex items-center gap-3 w-full px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-sliders w-5 text-center"></i> Configurações
                </button>
            </nav>

            <!-- Resumo Financeiro no rodapé da Sidebar -->
            <div class="p-4 mx-4 mb-6 bg-slate-850/50 border border-slate-700/40 rounded-2xl bg-[#1e293b]/40">
                <div class="space-y-2 text-xs">
                    <div class="flex justify-between">
                        <span class="text-slate-400">Orçamento Total:</span>
                        <span class="font-semibold text-emerald-400" id="sb-total-budget">R$ 0,00</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-400">Gasto Atual:</span>
                        <span class="font-semibold text-amber-500" id="sb-current-spend">R$ 0,00</span>
                    </div>
                    <div class="flex justify-between border-t border-slate-700/50 pt-2">
                        <span class="text-slate-400">Saldo:</span>
                        <span class="font-semibold" id="sb-balance">R$ 0,00</span>
                    </div>
                </div>

                <!-- Alerta de limite de orçamento atingido -->
                <div id="sb-alert-box" class="mt-3 p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 text-xs flex gap-2 items-center">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span id="sb-alert-text">Calculando...</span>
                </div>
            </div>
        </aside>

        <!-- BACKGROUND OVERLAY PARA DISPOSITIVOS MÓVEIS -->
        <div id="sidebar-overlay" onclick="UI.toggleSidebar()" class="fixed inset-0 z-40 hidden bg-slate-900/60 backdrop-blur-sm lg:hidden"></div>

        <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 dark:bg-slate-950">
            
            <!-- HEADER GLOBAL -->
            <header class="flex items-center justify-between h-16 px-6 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="UI.toggleSidebar()" class="p-2 -ml-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 lg:hidden">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-circle-nodes text-brand-500 text-lg"></i>
                        <h2 id="page-title" class="text-lg font-bold text-slate-800 dark:text-white">Dashboard</h2>
                    </div>
                </div>

                <!-- Controles Globais do Topo -->
                <div class="flex items-center gap-4">
                    <button onclick="UI.toggleTheme()" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-all duration-200" title="Alternar Tema Escuro">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>
                    <button onclick="UI.showNewProjectModal()" class="flex items-center gap-2 px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white font-medium rounded-xl text-sm shadow-md shadow-brand-500/10 transition-all duration-200">
                        <i class="fa-solid fa-plus"></i>
                        <span>Nova Obra</span>
                    </button>
                </div>
            </header>

            <!-- CONTAINER CENTRAL ONDE É APLICADA A RENDERIZAÇÃO DA SPA -->
            <section id="app-content" class="flex-1 overflow-y-auto p-6 space-y-6">
                <!-- Conteúdo dinâmico injetado via JS -->
            </section>
        </main>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- SISTEMA DE MODAL GLOBAL REUTILIZÁVEL -->
    <div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-slate-900/60 backdrop-blur-xs p-4">
        <div id="modal-content" class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl transform scale-95 opacity-0 transition-all duration-300 overflow-hidden flex flex-col max-h-[90vh]">
            <!-- Header do Modal -->
            <div class="flex items-center justify-between p-5 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50">
                <h3 id="modal-title" class="font-bold text-slate-800 dark:text-white text-base">Título</h3>
                <button onclick="Modal.close()" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 hover:text-slate-600 dark:hover:text-white transition-colors duration-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <!-- Body do Modal -->
            <div id="modal-body" class="p-6 overflow-y-auto flex-1 text-sm text-slate-600 dark:text-slate-300">
                <!-- Campos dinâmicos do formulário -->
            </div>
            <!-- Footer do Modal -->
            <div id="modal-footer" class="flex items-center justify-end gap-3 p-5 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50">
                <!-- Botões de Ações -->
            </div>
        </div>
    </div>

    <!-- LOGICA E CORE JS DO SISTEMA -->
    <script>
        // 1. DADOS DE DEMONSTRAÇÃO (Estrutura Inicial Conforme Imagem de Referência)
        const DEFAULT_STATE = {
            settings: {
                theme: 'light',
                totalBudget: 25000.00
            },
            materials: [
                { id: '1', name: 'Piso Cerâmico', category: 'Acabamento', unit: 'm²', quantity: 35.5, loss: 10, unitPrice: 89.00, total: 3499.75 },
                { id: '2', name: 'Tinta Acrílica Branca', category: 'Acabamento', unit: 'L', quantity: 20.0, loss: 5, unitPrice: 22.00, total: 462.00 },
                { id: '3', name: 'Cimento', category: 'Materiais Básicos', unit: 'kg', quantity: 300.0, loss: 2, unitPrice: 0.85, total: 260.10 },
                { id: '4', name: 'Tijolo 6 furos', category: 'Materiais Básicos', unit: 'un', quantity: 1000, loss: 0, unitPrice: 1.20, total: 1200.00 },
                { id: '5', name: 'Tubo PVC 25mm', category: 'Hidráulica', unit: 'm', quantity: 40.0, loss: 3, unitPrice: 6.90, total: 284.28 },
                { id: '6', name: 'Areia Média', category: 'Materiais Básicos', unit: 'm³', quantity: 2.50, loss: 5, unitPrice: 180.00, total: 472.50 }
            ],
            purchases: [
                { id: '1', name: 'Cimento', quantity: '150 kg', supplier: 'Depósito Real', priority: 'Alta', status: 'Pendente', price: 127.50 },
                { id: '2', name: 'Tinta Acrílica Branca', quantity: '8 L', supplier: 'Tintas & Cia', priority: 'Média', status: 'Pendente', price: 176.00 },
                { id: '3', name: 'Piso Cerâmico', quantity: '2.3 m²', supplier: 'Pisos Ideal', priority: 'Alta', status: 'Pendente', price: 204.70 }
            ],
            expenses: [
                { id: '1', description: 'Frete de Areia', category: 'Frete', amount: 120.00, date: '2026-05-10', notes: 'Transporte de materiais básicos' },
                { id: '2', description: 'Mão de Obra Contra-piso', category: 'Mão de Obra', amount: 950.00, date: '2026-05-12', notes: 'Diária do pedreiro e assistente' },
                { id: '3', description: 'Aluguel de Betoneira', category: 'Ferramentas', amount: 250.00, date: '2026-05-15', notes: 'Período de 15 dias' }
            ],
            suppliers: [
                { id: '1', name: 'Depósito Real', phone: '(11) 98888-7777', notes: 'Contato: Marcos. Desconto de 5% no PIX.', rating: 5 },
                { id: '2', name: 'Tintas & Cia', phone: '(11) 97777-6666', notes: 'Contato: Sandra. Frete grátis na região.', rating: 4 },
                { id: '3', name: 'Pisos Ideal', phone: '(11) 96666-5555', notes: 'Variedades de acabamentos premium.', rating: 5 }
            ],
            stages: [
                { id: '1', name: 'Estrutura & Alvenaria', responsible: 'Eng. Roberto', startDate: '2026-04-01', endDate: '2026-04-25', progress: 100, status: 'Concluído' },
                { id: '2', name: 'Instalações Hidráulicas', responsible: 'Carlos Encanador', startDate: '2026-04-26', endDate: '2026-05-10', progress: 90, status: 'Em andamento' },
                { id: '3', name: 'Revestimento e Acabamento', responsible: 'Mestre Gilberto', startDate: '2026-05-11', endDate: '2026-06-05', progress: 35, status: 'Em andamento' }
            ]
        };

        // 2. STORAGE SERVICE (Persistência no LocalStorage do Navegador)
        const StorageService = {
            get() {
                try {
                    const data = localStorage.getItem('obra_custos_app');
                    return data ? JSON.parse(data) : null;
                } catch (e) {
                    console.error("Erro ao ler LocalStorage", e);
                    return null;
                }
            },
            save(state) {
                try {
                    localStorage.setItem('obra_custos_app', JSON.stringify(state));
                } catch (e) {
                    console.error("Erro ao escrever no LocalStorage", e);
                }
            },
            reset() {
                localStorage.removeItem('obra_custos_app');
            }
        };

        // 3. ESTADO GLOBAL REATIVO (AppState)
        const AppState = {
            state: {},
            listeners: [],

            init() {
                const stored = StorageService.get();
                if (stored) {
                    this.state = stored;
                } else {
                    this.state = JSON.parse(JSON.stringify(DEFAULT_STATE));
                    StorageService.save(this.state);
                }
                this.notify();
            },

            subscribe(listener) {
                this.listeners.push(listener);
            },

            notify() {
                StorageService.save(this.state);
                this.listeners.forEach(fn => fn(this.state));
            },

            getTotals() {
                const totalBudget = this.state.settings.totalBudget;
                const materialsTotal = this.state.materials.reduce((acc, curr) => acc + (curr.total || 0), 0);
                const expensesTotal = this.state.expenses.reduce((acc, curr) => acc + (curr.amount || 0), 0);
                
                const totalSpend = materialsTotal + expensesTotal;
                const balance = totalBudget - totalSpend;
                const percentUsed = totalBudget > 0 ? (totalSpend / totalBudget) * 100 : 0;
                const isOverBudget = totalSpend > totalBudget;

                return {
                    totalBudget,
                    totalSpend,
                    balance,
                    percentUsed,
                    isOverBudget
                };
            }
        };

        // 4. VALIDATORS & FORMATTERS
        const Validators = {
            parseFloat(val) {
                if (typeof val === 'number') return val;
                if (!val) return 0;
                let formatted = val.toString().replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
                let parsed = parseFloat(formatted);
                return isNaN(parsed) ? 0 : parsed;
            },
            formatCurrency(val) {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
            },
            formatNumber(val, decimals = 2) {
                return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(val || 0);
            }
        };

        // 5. TOAST NOTIFICATION SYSTEM
        const Toast = {
            show(message, type = 'success') {
                const container = document.getElementById('toast-container');
                if (!container) return;

                const toast = document.createElement('div');
                toast.className = `flex items-center gap-3 px-4 py-3.5 rounded-xl border shadow-lg text-sm transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto`;
                
                let icon = '';
                if (type === 'success') {
                    toast.className += ' bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800/40';
                    icon = '<i class="fa-solid fa-circle-check text-emerald-500"></i>';
                } else if (type === 'error') {
                    toast.className += ' bg-rose-50 dark:bg-rose-950/40 text-rose-800 dark:text-rose-300 border-rose-200 dark:border-rose-800/40';
                    icon = '<i class="fa-solid fa-circle-xmark text-rose-500"></i>';
                } else {
                    toast.className += ' bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 border-amber-200 dark:border-amber-800/40';
                    icon = '<i class="fa-solid fa-circle-exclamation text-amber-500"></i>';
                }

                toast.innerHTML = `
                    <span class="text-base">${icon}</span>
                    <p class="font-medium">${message}</p>
                `;

                container.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.remove('translate-y-2', 'opacity-0');
                }, 50);

                setTimeout(() => {
                    toast.classList.add('translate-y-2', 'opacity-0');
                    setTimeout(() => {
                        toast.remove();
                    }, 300);
                }, 3500);
            }
        };

        // 6. REUSABLE MODAL SYSTEM
        const Modal = {
            open(title, bodyHTML, footerHTML) {
                const container = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');
                
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-body').innerHTML = bodyHTML;
                document.getElementById('modal-footer').innerHTML = footerHTML;

                container.classList.remove('hidden');
                setTimeout(() => {
                    content.classList.remove('scale-95', 'opacity-0');
                }, 10);
            },
            close() {
                const container = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');

                content.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    container.classList.add('hidden');
                }, 300);
            }
        };

        // 7. CHART.JS MANAGER
        const Charts = {
            instances: {},
            
            destroy(id) {
                if (this.instances[id]) {
                    this.instances[id].destroy();
                    delete this.instances[id];
                }
            },

            renderCategoryDistribution(canvasId, data) {
                this.destroy(canvasId);
                const ctx = document.getElementById(canvasId);
                if (!ctx) return;

                const isDark = document.documentElement.classList.contains('dark');

                this.instances[canvasId] = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(data),
                        datasets: [{
                            data: Object.values(data),
                            backgroundColor: ['#2563eb', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#64748b'],
                            borderWidth: isDark ? 2 : 1,
                            borderColor: isDark ? '#1e293b' : '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        cutout: '70%'
                    }
                });
            },

            renderBarComparison(canvasId, labels, expected, actual) {
                this.destroy(canvasId);
                const ctx = document.getElementById(canvasId);
                if (!ctx) return;

                const isDark = document.documentElement.classList.contains('dark');
                const gridColor = isDark ? '#334155' : '#e2e8f0';
                const textColor = isDark ? '#94a3b8' : '#475569';

                this.instances[canvasId] = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Previsto (R$)',
                                data: expected,
                                backgroundColor: '#93c5fd',
                                borderRadius: 6
                            },
                            {
                                label: 'Realizado (R$)',
                                data: actual,
                                backgroundColor: '#2563eb',
                                borderRadius: 6
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top',
                                labels: {
                                    color: textColor,
                                    font: { family: 'Inter', size: 12 }
                                }
                            }
                        },
                        scales: {
                            y: {
                                grid: { color: gridColor },
                                ticks: { color: textColor }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: textColor }
                            }
                        }
                    }
                });
            }
        };

        // 8. SPA ROUTER SYSTEM
        const Router = {
            currentRoute: 'dashboard',

            init() {
                const hash = window.location.hash.replace('#', '');
                this.navigate(hash || 'dashboard');

                window.addEventListener('hashchange', () => {
                    const newHash = window.location.hash.replace('#', '');
                    if (newHash && newHash !== this.currentRoute) {
                        this.navigate(newHash);
                    }
                });
            },

            navigate(route) {
                this.currentRoute = route;
                window.location.hash = route;
                
                // Toggle classes de link ativo
                document.querySelectorAll('[data-nav]').forEach(el => {
                    const activeClass = 'bg-brand-500 text-white shadow-md shadow-brand-500/10';
                    const inactiveClass = 'text-slate-300 hover:bg-slate-800 hover:text-white';
                    
                    if (el.getAttribute('data-nav') === route) {
                        el.className = el.className.replace(inactiveClass, '').trim() + ' ' + activeClass;
                    } else {
                        el.className = el.className.replace(activeClass, '').trim() + ' ' + inactiveClass;
                    }
                });

                const titleMap = {
                    dashboard: 'Dashboard',
                    materials: 'Itens / Materiais',
                    purchases: 'Planejamento de Compras',
                    expenses: 'Registro de Despesas',
                    stages: 'Etapas da Obra',
                    suppliers: 'Cadastro de Fornecedores',
                    reports: 'Relatórios Consolidados',
                    settings: 'Configurações'
                };
                document.getElementById('page-title').textContent = titleMap[route] || 'Gestão de Custos';

                const sidebar = document.getElementById('sidebar');
                if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
                    this.closeMobileSidebar();
                }

                UI.renderCurrentPage();
            },

            closeMobileSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        };

        // 9. CORE UI INTERACTION & RENDERING
        const UI = {
            editingMaterialId: null,

            init() {
                this.updateSidebarSummary();
                this.renderCurrentPage();
                this.applySavedTheme();
            },

            updateSidebarSummary() {
                const totals = AppState.getTotals();
                
                document.getElementById('sb-total-budget').textContent = Validators.formatCurrency(totals.totalBudget);

            toggleSidebar() {
                const sidebar = document.getElementById('sidebar');

                if (sidebar.classList.contains('-translate-x-full')) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            },

            toggleTheme() {
                const isDark = document.documentElement.classList.contains('dark');
                if (isDark) {
                    document.documentElement.classList.remove('dark');
                    AppState.state.settings.theme = 'light';
                    document.getElementById('theme-icon').className = "fa-solid fa-moon";
                } else {
                    document.documentElement.classList.add('dark');
                    AppState.state.settings.theme = 'dark';
                    document.getElementById('theme-icon').className = "fa-solid fa-sun";

                AppState.notify();
                this.renderCurrentPage();

            // CÁLCULOS DINÂMICOS
            bindCalculationEvents() {
                const qtyInput = document.getElementById('mat-qty');
                const priceInput = document.getElementById('mat-price');
                const lossInput = document.getElementById('mat-loss');
                const calcBox = document.getElementById('mat-calc-total');

                const updateSum = () => {
                    const q = Validators.parseFloat(qtyInput.value);
                    const p = Validators.parseFloat(priceInput.value);
                    const l = Validators.parseFloat(lossInput?.value || 0);
                    
                    const total = q * p * (1 + (l / 100));
                    calcBox.textContent = Validators.formatCurrency(total);
                };

                if (qtyInput && priceInput) {
                    qtyInput.addEventListener('input', updateSum);
                    priceInput.addEventListener('input', updateSum);
                    if (lossInput) lossInput.addEventListener('input', updateSum);
                }
            },

            saveMaterial(id) {
                const name = document.getElementById('m-name').value;
                const cat = document.getElementById('m-category').value;
                const unit = document.getElementById('m-unit').value;
                const qty = Validators.parseFloat(document.getElementById('m-qty').value);
                const price = Validators.parseFloat(document.getElementById('m-price').value);
                const loss = Validators.parseFloat(document.getElementById('m-loss').value || 0);

                if (!name || qty <= 0 || price <= 0) {
                    Toast.show("Por favor, preencha as informações básicas do material.", "error");
                    return;
                }

                const total = qty * price * (1 + (loss / 100));

                if (id) {
                    const idx = AppState.state.materials.findIndex(x => x.id === id);
                    if (idx !== -1) {
                        AppState.state.materials[idx] = { id, name, category: cat, unit, quantity: qty, loss, unitPrice: price, total };
                        Toast.show("Material atualizado!");
                    }
                } else {
                    AppState.state.materials.push({
                        id: Date.now().toString(),
                        name, category: cat, unit, quantity: qty, loss, unitPrice: price, total
                    });
                    Toast.show("Material adicionado!");
                }

                AppState.notify();
                Modal.close();
                this.renderCurrentPage();
            },

            submitMaterialForm() {
                const name = document.getElementById('mat-name').value;
                const cat = document.getElementById('mat-category').value;
                const unit = document.getElementById('mat-unit').value;
                const qty = Validators.parseFloat(document.getElementById('mat-qty').value);
                const price = Validators.parseFloat(document.getElementById('mat-price').value);
                const loss = Validators.parseFloat(document.getElementById('mat-loss').value || 0);

                if (!name || qty <= 0 || price <= 0) {
                    Toast.show("Preencha todos os campos corretamente com valores maiores que zero.", "error");
                    return;
                }

                const total = qty * price * (1 + (loss / 100));

                if (this.editingMaterialId) {
                    const matIndex = AppState.state.materials.findIndex(m => m.id === this.editingMaterialId);
                    if (matIndex !== -1) {
                        AppState.state.materials[matIndex] = {
                            id: this.editingMaterialId,
                            name, category: cat, unit, quantity: qty, loss, unitPrice: price, total
                        };
                        Toast.show("Material atualizado!");
                    }
                    this.editingMaterialId = null;
                    document.getElementById('mat-submit-btn').textContent = "Adicionar Item";
                } else {
                    AppState.state.materials.push({
                        id: Date.now().toString(),
                        name, category: cat, unit, quantity: qty, loss, unitPrice: price, total
                    });
                    Toast.show("Material adicionado!");
                }

                AppState.notify();
                this.clearMaterialForm();
                this.renderCurrentPage();
            },

            editMaterial(id) {
                const mat = AppState.state.materials.find(m => m.id === id);
                if (!mat) return;

                document.getElementById('mat-name').value = mat.name;
                document.getElementById('mat-category').value = mat.category;
                document.getElementById('mat-unit').value = mat.unit;
                document.getElementById('mat-qty').value = mat.quantity;
                document.getElementById('mat-price').value = mat.unitPrice;
                document.getElementById('mat-loss').value = mat.loss;
                document.getElementById('mat-calc-total').textContent = Validators.formatCurrency(mat.total);
                
                this.editingMaterialId = mat.id;
                document.getElementById('mat-submit-btn').textContent = "Salvar Edição";
                Toast.show("Dados carregados no formulário de edição!");
            },

            clearMaterialForm() {
                this.editingMaterialId = null;
                const form = document.getElementById('material-add-form');
                if (form) form.reset();
                
                const calcBox = document.getElementById('mat-calc-total');
                if (calcBox) calcBox.textContent = "R$ 0,00";
                
                const sbtn = document.getElementById('mat-submit-btn');
                if (sbtn) sbtn.textContent = "Adicionar Item";
            },

            deleteMaterial(id) {
                AppState.state.materials = AppState.state.materials.filter(m => m.id !== id);
                AppState.notify();
                this.renderCurrentPage();
                Toast.show("Material deletado.", "error");

            filterMaterialsTable() {
                const query = document.getElementById('mat-search').value.toLowerCase();
                const rows = document.querySelectorAll('#materials-table tbody tr');
                
                rows.forEach(row => {
                    const name = row.cells[0].textContent.toLowerCase();
                    if (name.includes(query)) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';

                });
